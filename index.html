<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Karhutla</title>
    
    <!-- Meta Tags for PWA -->
    <meta name="description" content="Aplikasi monitoring kebakaran hutan dan lahan (Karhutla) PT AI">
    <meta name="theme-color" content="#b91c1c"> <!-- Tailwind red-700 -->
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Monitoring Karhutla&quot;,&quot;short_name&quot;:&quot;Karhutla&quot;,&quot;description&quot;:&quot;Sistem Monitoring Kebakaran Hutan dan Lahan&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#ffffff&quot;,&quot;theme_color&quot;:&quot;#b91c1c&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;https://placehold.co/192x192/b91c1c/ffffff?text=Fire&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/png&quot;},{&quot;src&quot;:&quot;https://placehold.co/512x512/b91c1c/ffffff?text=Fire&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/png&quot;}]}">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/b91c1c/ffffff?text=Fire">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Styles to complement Tailwind */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling, map takes full screen */
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass {
            background: rgba(30, 41, 59, 0.85); /* Slate 800 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Mapbox Popup Styling Overrides */
        .maplibregl-popup-content {
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            font-family: 'Inter', sans-serif;
        }
        
        .maplibregl-popup-close-button {
            padding: 4px 8px;
            font-size: 1.2rem;
            color: #6b7280;
        }
        
        .maplibregl-popup-close-button:hover {
            background-color: #f3f4f6;
            color: #ef4444;
            border-radius: 0 0.75rem 0 0;
        }

        /* Loading Overlay */
        #loader {
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 h-screen w-screen flex flex-col overflow-hidden">

    <!-- Top Bar Navigation / Header Banner -->
    <header class="bg-white shadow-md z-30 shrink-0 w-full relative border-b border-gray-200">
        <div class="px-4 py-3 flex justify-between items-center w-full max-w-7xl mx-auto">
            <!-- App Title -->
            <div class="flex items-center gap-3">
                <div class="bg-red-100 text-red-600 p-2 rounded-lg">
                    <i class="fa-solid fa-fire-flame-curved text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-800 text-lg leading-tight">Karhutla Tracker</h1>
                    <p class="text-xs text-gray-500">Monitoring Hot Spot Aktif</p>
                </div>
            </div>

            <!-- Controls: Filter & Current Time -->
            <div class="flex flex-row items-center gap-4">
                <!-- Last Updated -->
                <div class="hidden sm:flex px-3 py-1 text-xs font-medium text-gray-600 items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span id="lastUpdated">Live Data</span>
                </div>

                <!-- Time Filter Select -->
                <div class="relative group">
                    <div class="flex items-center pl-3 pr-2 py-1.5 gap-2 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors border border-gray-200">
                        <i class="fa-regular fa-clock text-gray-500"></i>
                        <select id="timeFilter" class="bg-transparent text-sm font-medium text-gray-700 outline-none cursor-pointer appearance-none pr-6">
                            <option value="24" selected>24 Jam</option>
                            <option value="48">2 Hari</option>
                            <option value="168">7 Hari</option>
                        </select>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400 absolute right-3 pointer-events-none"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative w-full h-full">

        <!-- Full Screen Loader -->
        <div id="loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white">
            <div class="relative w-24 h-24">
                <div class="absolute inset-0 border-4 border-red-200 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-red-600 rounded-full border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-red-600 text-3xl">
                    <i class="fa-solid fa-fire"></i>
                </div>
            </div>
            <h2 class="mt-4 text-xl font-bold text-gray-800">Memuat Data Karhutla...</h2>
            <p class="text-sm text-gray-500">Menghubungkan ke data Sipongi...</p>
            <p class="text-sm text-gray-500">NASA Satellite : AQUA/TERRA, SNPP, NOAA20</p>
        </div>

        <!-- The Map Container -->
        <div id="map" class="absolute inset-0 z-10 w-full h-full"></div>

        <!-- Floating Stats Card (Top Left) -->
        <div class="absolute top-4 left-4 z-20 pointer-events-none">
            <div class="glass rounded-2xl p-4 shadow-xl pointer-events-auto border-t-4 border-t-red-500 min-w-[210px]">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Total Hot Spot</h3>
                <div class="flex items-baseline gap-2 mb-2">
                    <span id="hotspotCount" class="text-3xl font-extrabold text-gray-800">0</span>
                    <span class="text-xs text-gray-500 font-medium">spot</span>
                </div>
                
                <div class="pt-2.5 border-t border-gray-200 space-y-1.5">
                    <div class="flex items-center justify-between text-xs mb-1">
                        <span class="text-gray-500">Filter Aktif:</span>
                        <span id="activeFilterLabel" class="font-semibold text-gray-700">24 Jam</span>
                    </div>

                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider pt-1 border-t border-gray-100">Statistik Recency</div>
                    
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block"></span>
                            <span class="text-gray-600">&le; 24 Jam</span>
                        </div>
                        <span id="count24h" class="font-bold text-gray-800">0</span>
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span>
                            <span class="text-gray-600">24-48 Jam</span>
                        </div>
                        <span id="count48h" class="font-bold text-gray-800">0</span>
                    </div>

                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span>
                            <span class="text-gray-600">&gt; 2 Hari</span>
                        </div>
                        <span id="countOld" class="font-bold text-gray-800">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Basemap Layer Control (Top Right) -->
        <div class="absolute top-4 right-4 z-20">
            <div class="glass rounded-xl p-1 shadow-lg flex flex-col gap-1 border border-white/40">
                <button id="btnSat" onclick="switchBasemap('satellite')" class="w-full px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-globe"></i> Satellite
                </button>
                <button id="btnOrtho" onclick="switchBasemap('ortho')" class="w-full px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-700 hover:bg-white/60 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-layer-group"></i> Orthophoto
                </button>
            </div>
        </div>
    </main>

    <!-- Map Controls container (Bottom Right - handled by MapLibre, but space reserved) -->

    <script>
        // --- Constants & Global Variables ---
        const API_URL = "https://script.google.com/macros/s/AKfycbx7KdoazOkPP9dWQZwX7sisCbcLBB0xTJoeHzFKGzKMhKwcJU35OYYALTac1CSHMDuI/exec?action=get_all";
        let map;
        let allHotspots = [];
        let currentMarkers = [];
        let geojsonBoundaryData = null;

        // --- DOM Elements ---
        const loader = document.getElementById('loader');
        const hotspotCountEl = document.getElementById('hotspotCount');
        const timeFilterEl = document.getElementById('timeFilter');
        const activeFilterLabelEl = document.getElementById('activeFilterLabel');
        const lastUpdatedEl = document.getElementById('lastUpdated');
        const count24hEl = document.getElementById('count24h');
        const count48hEl = document.getElementById('count48h');
        const countOldEl = document.getElementById('countOld');

        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'karhutla-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['/'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }

        // Initialize MapLibre with Basemap Sources
        function initMap() {
            const googleSatelliteSource = {
                type: 'raster',
                tiles: [
                    'https://mt0.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}',
                    'https://mt1.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}',
                    'https://mt2.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}',
                    'https://mt3.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}'
                ],
                tileSize: 256
            };

            const orthophotoSource = {
                type: 'raster',
                tiles: [
                    'http://10.165.1.14:9090/service?layer=basemap-image&style=&tilematrixset=grid_merc&Service=WMTS&Request=GetTile&Version=1.3.0&Format=png&TileMatrix={z}&TileCol={x}&TileRow={y}'
                ],
                tileSize: 256
            };

            map = new maplibregl.Map({
                container: 'map',
                style: {
                    version: 8,
                    sources: {
                        'google-satellite': googleSatelliteSource,
                        'orthophoto': orthophotoSource
                    },
                    layers: [
                        {
                            id: 'satellite-layer',
                            type: 'raster',
                            source: 'google-satellite',
                            paint: {},
                            layout: { visibility: 'visible' }
                        },
                        {
                            id: 'orthophoto-layer',
                            type: 'raster',
                            source: 'orthophoto',
                            paint: {},
                            layout: { visibility: 'none' }
                        }
                    ]
                },
                center: [115.515, -2.2], // Center diperbarui ke [115.515, -2.2]
                zoom: 11, // Zoom level diperbarui ke 11
                pitch: 0,
                maxZoom: 18
            });

            // Add Map Controls
            map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
            map.addControl(new maplibregl.GeolocateControl({
                positionOptions: { enableHighAccuracy: true },
                trackUserLocation: true
            }), 'bottom-right');

            // Map on load event
            map.on('load', () => {
                fetchData();
                loadBoundary();
            });
        }

        // Switch Basemap Layer
        function switchBasemap(type) {
            const btnSat = document.getElementById('btnSat');
            const btnOrtho = document.getElementById('btnOrtho');

            if (type === 'satellite') {
                map.setLayoutProperty('satellite-layer', 'visibility', 'visible');
                map.setLayoutProperty('orthophoto-layer', 'visibility', 'none');
                
                btnSat.className = "w-full px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer";
                btnOrtho.className = "w-full px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-700 hover:bg-white/60 transition-all flex items-center justify-center gap-1.5 cursor-pointer";
            } else if (type === 'ortho') {
                map.setLayoutProperty('satellite-layer', 'visibility', 'none');
                map.setLayoutProperty('orthophoto-layer', 'visibility', 'visible');

                btnOrtho.className = "w-full px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-600 text-white shadow-sm transition-all flex items-center justify-center gap-1.5 cursor-pointer";
                btnSat.className = "w-full px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-700 hover:bg-white/60 transition-all flex items-center justify-center gap-1.5 cursor-pointer";
            }
        }

        // --- STREAMING_CHUNK:Fetching and processing API data ---
        // Fetch Hotspot Data from GAS API
        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allHotspots = data;
                    updateTimestamp();
                    applyFilter(); // Apply default filter immediately
                } else {
                    console.error("Format data API tidak sesuai. Diharapkan Array.");
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                
                // Membuat sample data dinamis agar filter bisa ditest jika API gagal
                const rightNow = new Date();
                const minus12H = new Date(rightNow.getTime() - (12 * 60 * 60 * 1000)).toISOString();
                const minus36H = new Date(rightNow.getTime() - (36 * 60 * 60 * 1000)).toISOString();
                const minus100H = new Date(rightNow.getTime() - (100 * 60 * 60 * 1000)).toISOString();

                // Fallback to sample data
                allHotspots = [
                    { "id": "s1", "date": "12 Jam Lalu", "date_ori": minus12H, "lat": -2.20798, "lng": 115.49644, "confidence": "high", "satellite": "NASA-NOAA20", "desa": "Maburai", "kecamatan": "Murung Pudak", "kabkota": "Tabalong", "provinsi": "Kalimantan Selatan" },
                    { "id": "s2", "date": "36 Jam Lalu", "date_ori": minus36H, "lat": -2.21248, "lng": 115.49794, "confidence": "medium", "satellite": "NASA-NOAA20", "desa": "Lok Batung", "kecamatan": "Paringin", "kabkota": "Balangan", "provinsi": "Kalimantan Selatan" },
                    { "id": "s3", "date": "100 Jam Lalu", "date_ori": minus100H, "lat": -2.5, "lng": 115.6, "confidence": "low", "satellite": "AQUA", "desa": "Dummy", "kecamatan": "Dummy", "kabkota": "Banjarbaru", "provinsi": "Kalimantan Selatan" }
                ];
                updateTimestamp();
                applyFilter();
            } finally {
                // Hide loader
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        // Optional: Load GeoJSON boundary (e.g., Kalsel province boundary)
        async function loadBoundary() {
            // URL file geojson. Ganti dengan nama/URL file GeoJSON Anda
            const geojsonUrl = 'aoi_monitoring.geojson'; 
            
            try {
                // Mencoba fetch overlay GeoJSON dari file eksternal/lokal
                const response = await fetch(geojsonUrl);
                if (!response.ok) throw new Error('GeoJSON file not found');
                
                const geojsonData = await response.json();

                map.addSource('boundary', {
                    'type': 'geojson',
                    'data': geojsonData
                });
            } catch (e) {
                console.warn('File aoi_monitoring.geojson tidak ditemukan, menggunakan data batas area sample default.');
                // Fallback default polygon batas (hanya untuk simulasi jika file lokal tidak ada)
                map.addSource('boundary', {
                    'type': 'geojson',
                    'data': {
                        "type": "FeatureCollection",
                        "features": [{
                            "type": "Feature",
                            "geometry": {
                                "type": "Polygon",
                                "coordinates": [[[114.3, -1.2], [116.6, -1.2], [116.6, -4.3], [114.3, -4.3], [114.3, -1.2]]]
                            }
                        }]
                    }
                });
            }

            map.addLayer({
                'id': 'boundary-fill',
                'type': 'fill',
                'source': 'boundary',
                'layout': {},
                'paint': {
                    'fill-color': '#fcd34d',
                    'fill-opacity': 0.1
                }
            });

            map.addLayer({
                'id': 'boundary-line',
                'type': 'line',
                'source': 'boundary',
                'layout': {},
                'paint': {
                    'line-color': '#f59e0b', // Amber-500
                    'line-width': 2,
                    'line-dasharray': [2, 2]
                }
            });
        }

        // --- STREAMING_CHUNK:Filtering Logic ---
        // Filter Data based on selected time
        function applyFilter() {
            const hours = parseInt(timeFilterEl.value);
            const now = new Date(); // Menggunakan jam aktual sistem saat ini
            
            let c24 = 0;
            let c48 = 0;
            let cOld = 0;

            const filteredData = allHotspots.filter(spot => {
                if (!spot.date_ori) return false;
                const spotTime = new Date(spot.date_ori);
                
                // Hitung selisih waktu sebenarnya
                const diffTime = now.getTime() - spotTime.getTime();
                const diffHours = diffTime / (1000 * 60 * 60); 
                
                const isValid = diffHours <= hours && diffHours >= -24;
                if (isValid) {
                    if (diffHours <= 24) c24++;
                    else if (diffHours <= 48) c48++;
                    else cOld++;
                }
                return isValid; 
            });

            // Update UI Labels
            const filterLabels = {
                '24': '24 Jam',
                '48': '2 Hari',
                '168': '7 Hari'
            };
            activeFilterLabelEl.innerText = filterLabels[hours];

            renderMarkers(filteredData);
            
            // Animate count updates
            animateValue(hotspotCountEl, parseInt(hotspotCountEl.innerText || 0), filteredData.length, 500);
            if (count24hEl) animateValue(count24hEl, parseInt(count24hEl.innerText || 0), c24, 500);
            if (count48hEl) animateValue(count48hEl, parseInt(count48hEl.innerText || 0), c48, 500);
            if (countOldEl) animateValue(countOldEl, parseInt(countOldEl.innerText || 0), cOld, 500);
        }

        // --- STREAMING_CHUNK:Rendering Markers on Map ---
        // Render Markers on Map
        function renderMarkers(data) {
            // Remove existing markers
            currentMarkers.forEach(marker => marker.remove());
            currentMarkers = [];

            const now = new Date();

            data.forEach(spot => {
                if (!spot.lat || !spot.lng) return;

                // Hitung selisih waktu (dalam jam) dari date_ori hingga saat ini
                let diffHours = 0;
                if (spot.date_ori) {
                    const spotTime = new Date(spot.date_ori);
                    diffHours = (now.getTime() - spotTime.getTime()) / (1000 * 60 * 60);
                }

                // Klasifikasi warna marker berdasarkan WAKTU (Recency)
                let markerColor = '#9ca3af'; // Grey / Abu-abu (> 48 jam / 2 hari s/d 7 hari)
                let timeCategoryLabel = '> 2 Hari (s/d 7 Hari)';

                if (diffHours <= 24) {
                    markerColor = '#f97316'; // Orange (0 - 24 Jam)
                    timeCategoryLabel = '< 24 Jam';
                } else if (diffHours <= 48) {
                    markerColor = '#facc15'; // Yellow / Kuning (24 - 48 Jam / 2 Hari)
                    timeCategoryLabel = '24 - 48 Jam';
                }

                // Membuat elemen HTML kustom untuk Marker Lingkaran (Circle)
                const el = document.createElement('div');
                el.className = 'w-3.5 h-3.5 rounded-full border-2 border-white shadow-md cursor-pointer';
                el.style.backgroundColor = markerColor;

                // Create Popup HTML based on JSON attributes constraint
                const popupContent = `
                    <div class="min-w-[200px]">
                        <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100">
                            <i class="fa-solid fa-fire text-red-500"></i>
                            <h3 class="font-bold text-gray-800 text-sm">Detail Hot Spot</h3>
                        </div>
                        <div class="space-y-1.5 text-xs text-gray-600">
                            <div class="flex justify-between"><span class="font-medium">Tanggal:</span> <span>${spot.date || '-'}</span></div>
                            <div class="flex justify-between"><span class="font-medium">Rentang Waktu:</span> 
                                <span class="font-bold" style="color: ${markerColor}">
                                    ${timeCategoryLabel}
                                </span>
                            </div>
                            <div class="flex justify-between"><span class="font-medium">Confidence:</span> 
                                <span class="capitalize font-semibold text-gray-700">
                                    ${spot.confidence || '-'}
                                </span>
                            </div>
                            <div class="flex justify-between"><span class="font-medium">Satelit:</span> <span>${spot.satellite || '-'}</span></div>
                            <div class="mt-2 pt-2 border-t border-gray-100">
                                <div class="flex flex-col">
                                    <span class="font-medium">Lokasi:</span>
                                    <span class="text-gray-800">${spot.desa ? spot.desa + ', ' : ''}${spot.kecamatan || ''}</span>
                                    <span class="text-gray-500">${spot.kabkota || ''}, ${spot.provinsi || ''}</span>
                                </div>
                            </div>
                            <div class="mt-2 pt-2 border-t border-gray-100 text-xs text-gray-500">
                                Coordinate: <a href="https://www.google.com/maps?q=${spot.lat},${spot.lng}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline font-medium inline-flex items-center gap-1">${spot.lat}, ${spot.lng} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>
                            </div>
                        </div>
                    </div>
                `;

                // Menambahkan marker circle custom ke map
                const marker = new maplibregl.Marker({ element: el })
                    .setLngLat([spot.lng, spot.lat])
                    .setPopup(new maplibregl.Popup({ offset: 10, closeButton: true, maxWidth: '300px' })
                        .setHTML(popupContent))
                    .addTo(map);

                currentMarkers.push(marker);
            });
        }

        // --- STREAMING_CHUNK:Helper Functions & Event Listeners ---
        // Helper: Number animation
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // easeOutQuart
                const ease = 1 - Math.pow(1 - progress, 4);
                obj.innerHTML = Math.floor(ease * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        // Helper: Update timestamp text
        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            lastUpdatedEl.innerHTML = `Update: ${timeString}`;
        }

        // Event Listeners
        timeFilterEl.addEventListener('change', applyFilter);

        // Bootstrap App
        initMap();

    </script>
</body>
</html>
